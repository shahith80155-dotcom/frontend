<!DOCTYPE html>
<html>
<head>
    <title>Generate Seating</title>
    <link rel="stylesheet" href="seating.css">
</head>

<body>

<div class="container">

    <h1>Generate Seating ⚙️</h1>
    <p>Create seating arrangement easily</p>

    <!-- EXTRA ROOM -->
    <label>
        <input type="checkbox" id="extraRoom">
        Add Extra Room
    </label>

    <!-- MODE SELECTION (RADIO BUTTONS ✅) -->
    <div style="margin-top:15px; text-align:left;">
        <p><b>Select Mode:</b></p>

        <label>
            <input type="radio" name="mode" value="normal" checked>
            Normal Mode
        </label>
        <br>

        <label>
            <input type="radio" name="mode" value="strict">
            Strict Mode
        </label>
    </div>

    <!-- INFO -->
    <p style="font-size:12px;color:gray;">
        ✔ Normal → same subject may sit together <br>
        ✔ Strict → no same subject adjacent
    </p>

    <!-- EXTRA INPUTS -->
    <div id="extraInputs" style="display:none; margin-top:10px;">
        <input type="number" id="extraRows" placeholder="Rows" min="1">
        <input type="number" id="extraCols" placeholder="Columns" min="1">
        <input type="number" id="extraBench" placeholder="Bench" value="1" min="1">
    </div>

    <br>

    <button onclick="generateSeating()">Generate Seating</button>
    <button onclick="goToView()">View Seating</button>

    <p id="msg"></p>

</div>

<script>

// 🔐 protect page
let user = localStorage.getItem("user")
if(!user) window.location.href = "login.html"

// toggle extra inputs
document.getElementById("extraRoom").addEventListener("change", function () {
    document.getElementById("extraInputs").style.display =
        this.checked ? "block" : "none"
})

// GENERATE FUNCTION
function generateSeating(){

    let allowExtra = document.getElementById("extraRoom").checked
    let mode = document.querySelector('input[name="mode"]:checked').value
    let strictMode = mode === "strict"

    let msg = document.getElementById("msg")

    let url = `https://exam-seating-arrangement-k7ln.onrender.com/generate-seating?extra=${allowExtra}&strict=${strictMode}`

    // EXTRA ROOM VALIDATION
    if(allowExtra){

        let rows = document.getElementById("extraRows").value
        let cols = document.getElementById("extraCols").value
        let bench = document.getElementById("extraBench").value || 1

        if(!rows || !cols){
            msg.innerText = "Enter rows & columns ❌"
            msg.style.color = "red"
            return
        }

        if(rows <= 0 || cols <= 0 || bench <= 0){
            msg.innerText = "Values must be greater than 0 ❌"
            msg.style.color = "red"
            return
        }

        url += `&rows=${rows}&cols=${cols}&bench=${bench}`
    }

    msg.innerText = "Generating seating..."
    msg.style.color = "white"

    fetch(url)
    .then(res => res.json())
    .then(data => {

        localStorage.setItem("seating", JSON.stringify(data))

        // MODE MESSAGE
        if(data.mode === "STRICT"){
            msg.innerText = "Strict mode applied (no same subject adjacent)"
            msg.style.color = "orange"
        }else{
            msg.innerText = "Normal mode applied (same subject may sit together)"
            msg.style.color = "lightblue"
        }
    })
    .catch(()=>{
        msg.innerText = "Error generating seating ❌"
        msg.style.color = "red"
    })
}

// VIEW PAGE
function goToView(){
    window.location.href = "view.html"
}

</script>

</body>
</html>
