<!DOCTYPE html>
<html>
<head>
    <title>Generate Seating</title>
    <link rel="stylesheet" href="seating.css">
</head>

<body>

<div class="container">

    <h1>Generate Seating ⚙️</h1>

    <!-- EXTRA ROOM -->
    <label class="checkbox-container">
        <input type="checkbox" id="extraRoom">
        <span class="label-text">Add Extra Room</span>
    </label>

    <!-- NORMAL MODE -->
    <label class="checkbox-container">
        <input type="checkbox" id="normalMode" checked>
        <span class="label-text">Normal Mode</span>
    </label>

    <!-- STRICT MODE -->
    <label class="checkbox-container">
        <input type="checkbox" id="strictMode">
        <span class="label-text">Strict Mode</span>
    </label>

    <!-- INFO -->
    <p style="font-size:12px;color:gray;">
        ✔ Normal → same subject may sit together <br>
        ✔ Strict → no same subject adjacent
    </p>

    <!-- Extra Inputs -->
    <div id="extraInputs" style="display:none;">
        <input type="number" id="extraRows" placeholder="Rows">
        <input type="number" id="extraCols" placeholder="Cols">
        <input type="number" id="extraBench" placeholder="Bench" value="1">
    </div>

    <button onclick="generateSeating()">Generate Seating</button>

    <p id="msg"></p>

</div>

<script>

// 🔐 protect
let user = localStorage.getItem("user")
if(!user) window.location.href = "login.html"

// toggle extra
document.getElementById("extraRoom").addEventListener("change", function () {
    document.getElementById("extraInputs").style.display =
        this.checked ? "block" : "none"
})

// ⚡ MAKE CHECKBOXES MUTUALLY EXCLUSIVE
document.getElementById("normalMode").addEventListener("change", function(){
    if(this.checked){
        document.getElementById("strictMode").checked = false
    }
})

document.getElementById("strictMode").addEventListener("change", function(){
    if(this.checked){
        document.getElementById("normalMode").checked = false
    }
})

// GENERATE
function generateSeating(){

    let allowExtra = document.getElementById("extraRoom").checked
    let normalMode = document.getElementById("normalMode").checked
    let strictMode = document.getElementById("strictMode").checked
    let msg = document.getElementById("msg")

    // ❌ VALIDATION
    if(!normalMode && !strictMode){
        msg.innerText = "Select a mode ❌"
        msg.style.color = "red"
        return
    }

    let url = `https://exam-seating-arrangement-k7ln.onrender.com/generate-seating?extra=${allowExtra}&strict=${strictMode}`

    // extra room
    if(allowExtra){
        let rows = document.getElementById("extraRows").value
        let cols = document.getElementById("extraCols").value
        let bench = document.getElementById("extraBench").value || 1

        if(!rows || !cols){
            msg.innerText = "Enter rows & cols ❌"
            msg.style.color = "red"
            return
        }

        url += `&rows=${rows}&cols=${cols}&bench=${bench}`
    }

    msg.innerText = "Generating..."
    msg.style.color = "white"

    fetch(url)
    .then(res => res.json())
    .then(data => {

        localStorage.setItem("seating", JSON.stringify(data))

        if(data.mode === "STRICT"){
            msg.innerText = "Strict mode applied"
            msg.style.color = "orange"
        }else{
            msg.innerText = "Normal mode applied"
            msg.style.color = "lightblue"
        }
    })
    .catch(()=>{
        msg.innerText = "Error ❌"
        msg.style.color = "red"
    })
}

</script>

</body>
</html>
