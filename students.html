<!DOCTYPE html>
<html>
<head>
<title>Upload Student List</title>

<style>

/* 🌌 BACKGROUND */
body{
    margin:0;
    font-family: Arial;
    color:white;
    background: radial-gradient(circle at top left, #1a0033, #000);
    overflow:hidden;
}

/* ⭐ STARS */
body::before, body::after{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background-image:
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 70% 80%, #ccc, transparent),
        radial-gradient(2px 2px at 40% 60%, #aaa, transparent);
    animation: moveStars 120s linear infinite;
    z-index:-2;
}
body::after{
    animation-direction: reverse;
    opacity:0.5;
}

@keyframes moveStars{
    from{transform: translateY(0);}
    to{transform: translateY(-1500px);}
}

/* 🌠 SHOOTING STARS */
.shooting-star{
    position:fixed;
    width:2px;
    height:80px;
    background:linear-gradient(-45deg, white, transparent);
    animation:shoot 6s linear infinite;
}
.shooting-star:nth-child(1){ left:20%; animation-delay:2s; }
.shooting-star:nth-child(2){ left:50%; animation-delay:5s; }
.shooting-star:nth-child(3){ left:80%; animation-delay:8s; }

@keyframes shoot{
    0%{ transform: translateY(-100px) translateX(0) rotate(45deg); opacity:0;}
    10%{ opacity:1;}
    100%{ transform: translateY(800px) translateX(-300px) rotate(45deg); opacity:0;}
}

/* 📦 CONTAINER */
.students-container{
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    padding:30px;
    width:380px;
    margin:auto;
    margin-top:60px;
    border-radius:20px;
    box-shadow: 0 0 40px rgba(160,32,240,0.4);
    text-align:center;
}

/* HEADINGS */
h2{
    color:#d9a3ff;
    text-shadow:0 0 20px #a020f0;
}

/* INPUT + SELECT */
input, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    background:rgba(255,255,255,0.08);
    color:white;
    outline:none;
}

/* SELECT CUSTOM */
select{
    appearance:none;
    cursor:pointer;
    background-image: linear-gradient(45deg, transparent 50%, #a020f0 50%),
                      linear-gradient(135deg, #a020f0 50%, transparent 50%);
    background-position: calc(100% - 20px) calc(1em),
                         calc(100% - 15px) calc(1em);
    background-size: 5px 5px;
    background-repeat: no-repeat;
}

/* FILE INPUT */
input[type="file"]{
    display:none;
}

.file-upload{
    width:100%;
    padding:12px;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    cursor:pointer;
    text-align:left;
}

.file-upload:hover{
    box-shadow:0 0 10px #a020f0;
}

.file-upload::before{
    content:"Choose File";
    background:#a020f0;
    padding:5px 12px;
    border-radius:6px;
    color:white;
    margin-right:10px;
}

.file-name{
    font-size:13px;
    color:#aaa;
    margin-left:10px;
}

/* BUTTONS */
button{
    width:100%;
    padding:12px;
    border-radius:25px;
    border:none;
    margin-top:15px;
    cursor:pointer;
    font-weight:bold;
}

/* upload */
.upload-btn{
    background:linear-gradient(90deg,#a020f0,#ff00cc);
    color:white;
    box-shadow:0 0 20px #a020f0;
}
.upload-btn:hover{
    box-shadow:0 0 30px #ff00cc;
}

/* delete */
.delete-btn{
    background:red;
    color:white;
}

/* back button */
.back-btn{
    margin-top:20px;
    background:#333;
    color:#ccc;
}
.back-btn:hover{
    background:#555;
    color:white;
}

/* MESSAGE */
#msg{
    margin-top:10px;
}

</style>
</head>

<body>

<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>

<div class="students-container">

<h2>Upload Students 🚀</h2>

<h3>Regular Students</h3>

<select id="dept">
<option value="">Select Department</option>
<option>CSE</option>
<option>ECE</option>
<option>IT</option>
<option>MECH</option>
<option>CIVIL</option>
</select>

<label class="file-upload">
    <input type="file" id="regularFile" onchange="showFileName(this,'file1')">
    <span id="file1" class="file-name">No file chosen</span>
</label>

<br>

<label>Arrear students?</label>

<select onchange="showArrear(this.value)">
<option value="no">No</option>
<option value="yes">Yes</option>
</select>

<div id="arrearSection" style="display:none;">

<h3>Arrear Students</h3>

<select id="arrearDept">
<option value="">Select Department</option>
<option>CSE</option>
<option>ECE</option>
<option>IT</option>
<option>MECH</option>
<option>CIVIL</option>
</select>

<label class="file-upload">
    <input type="file" id="arrearFile" onchange="showFileName(this,'file2')">
    <span id="file2" class="file-name">No file chosen</span>
</label>

</div>

<button class="upload-btn" onclick="uploadStudents()">Upload Students</button>

<button class="delete-btn" onclick="deleteAllStudents()">Delete All Students</button>

<p id="msg"></p>

<button class="back-btn" onclick="goBack()">← Back to Dashboard</button>

</div>

<script>

let user = localStorage.getItem("user")
if(!user){
    window.location.href = "/dashboard.html"
}

/* FILE NAME SHOW */
function showFileName(input,id){
    let name = input.files[0]?.name || "No file chosen"
    document.getElementById(id).innerText = name
}

/* SHOW ARREAR */
function showArrear(val){
    document.getElementById("arrearSection").style.display =
        val==="yes" ? "block":"none"
}

/* DELETE */
function deleteAllStudents(){
    fetch("https://exam-seating-arrangement-k7ln.onrender.com/delete-all-students",{
        method:"DELETE"
    })
    .then(res=>res.text())
    .then(msg=>{
        document.getElementById("msg").innerText = msg
        setTimeout(()=>location.reload(),1000)
    })
}

/* UPLOAD */
function uploadStudents(){

let dept = document.getElementById("dept").value
let file = document.getElementById("regularFile").files[0]
let arrearFile = document.getElementById("arrearFile").files[0]
let arrearDept = document.getElementById("arrearDept").value
let msg = document.getElementById("msg")

if(dept==="" || !file){
    msg.innerText="Select department & file ❌"
    msg.style.color="red"
    return
}

let formData = new FormData()
formData.append("dept",dept)
formData.append("regularFile",file)

if(arrearFile){
    formData.append("arrearFile",arrearFile)
    formData.append("arrearDept",arrearDept)
}

fetch("https://exam-seating-arrangement-k7ln.onrender.com/upload-students",{
    method:"POST",
    body:formData
})
.then(res=>res.text())
.then(data=>{
    msg.innerText=data
    msg.style.color="green"
})
.catch(()=>{
    msg.innerText="Upload failed ❌"
    msg.style.color="red"
})

}

/* BACK */
function goBack(){
    window.location.href="dashboard.html"
}

</script>

</body>
</html>
