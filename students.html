<!DOCTYPE html>
<html>
<head>
<title>Upload Student List</title>

<style>

/* 🌌 BODY */
body{
    margin:0;
    font-family: Arial;
    background: radial-gradient(circle at top left, #1a0033, #000);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* ⭐ STARS */
body::before, body::after{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    z-index:-1;
}

body::before{
    background-image:
        radial-gradient(1px 1px at 20% 30%, white, transparent),
        radial-gradient(1px 1px at 70% 80%, #ccc, transparent),
        radial-gradient(1px 1px at 50% 50%, #aaa, transparent);
    animation: moveStars 200s linear infinite;
}

body::after{
    background-image:
        radial-gradient(2px 2px at 40% 60%, white, transparent),
        radial-gradient(2px 2px at 80% 20%, #aaa, transparent);
    animation: moveStars 120s linear infinite reverse;
}

@keyframes moveStars{
    from{ transform: translateY(0); }
    to{ transform: translateY(-1500px); }
}

/* 🌠 SHOOTING STARS */
.shooting-star{
    position: fixed;
    width: 2px;
    height: 80px;
    background: linear-gradient(white, transparent);
    top: -100px;
    opacity: 0;
    animation: shoot 6s linear infinite;
}

.shooting-star:nth-child(1){ left:20%; animation-delay:2s; }
.shooting-star:nth-child(2){ left:50%; animation-delay:5s; }
.shooting-star:nth-child(3){ left:80%; animation-delay:8s; }

@keyframes shoot {
    0% { transform: translate(0,0) rotate(45deg); opacity:0; }
    10% { opacity:1; }
    100% { transform: translate(-300px,800px) rotate(45deg); opacity:0; }
}

/* ✨ GLASS CARD */
.students-container{
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    padding:35px;
    width:380px;
    border-radius:20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;

    box-shadow:
        0 0 40px rgba(160,32,240,0.4),
        inset 0 0 10px rgba(255,255,255,0.05);
}

/* TITLES */
h2{
    margin:0;
    color:#e0b3ff;
    text-shadow:0 0 20px rgba(160,32,240,0.8);
}

h3{
    margin:5px 0;
    color:#bbb;
}

/* INPUTS */
input, select{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
    outline:none;
    background: rgba(255,255,255,0.08);
    color:white;
}

/* LABEL */
label{
    font-size:14px;
    color:#ccc;
}

/* BUTTONS */
button{
    width:100%;
    padding:12px;
    border-radius:25px;
    border:none;
    background: linear-gradient(90deg,#a020f0,#ff00cc);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px #a020f0;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #ff00cc;
}

/* DELETE BUTTON */
.delete-btn{
    background:red;
}

/* BACK BUTTON */
.back-btn{
    width:100%;
    text-align:center;
    padding:10px;
    border-radius:20px;
    background:#333;
    color:white;
    text-decoration:none;
    margin-top:5px;
    transition:0.3s;
}

.back-btn:hover{
    background:#555;
}

/* MESSAGE */
#msg{
    font-size:14px;
}

</style>

</head>

<body>

<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>

<div class="students-container">

<h2>Upload Students 🚀</h2>

<h3>Regular Students</h3>

<select id="dept">
<option value="">Select Department</option>
<option>CSE</option>
<option>ECE</option>
<option>IT</option>
<option>MECH</option>
<option>CIVIL</option>
</select>

<input type="file" id="regularFile" accept=".csv">

<label>Arrear students?</label>

<select onchange="showArrear(this.value)">
<option value="no">No</option>
<option value="yes">Yes</option>
</select>

<div id="arrearSection" style="display:none; width:100%;">

<h3>Arrear Students</h3>

<select id="arrearDept">
<option value="">Select Department</option>
<option>CSE</option>
<option>ECE</option>
<option>IT</option>
<option>CIVIL</option>
<option>MECH</option>
</select>

<input type="file" id="arrearFile" accept=".csv">

</div>

<button onclick="uploadStudents()">Upload Students</button>

<button class="delete-btn" onclick="deleteAllStudents()">
Delete All Students
</button>

<p id="msg"></p>

<a href="dashboard.html" class="back-btn">⬅ Back to Dashboard</a>

</div>

<script>

let user = localStorage.getItem("user")
if(!user){
    window.location.href = "/dashboard.html"
}

function deleteAllStudents(){
    fetch("https://exam-seating-arrangement-k7ln.onrender.com/delete-all-students", {
        method: "DELETE"
    })
    .then(res => res.text())
    .then(msg => {
        document.getElementById("msg").innerText = msg
        setTimeout(() => location.reload(), 1000)
    })
}

function showArrear(value){
    document.getElementById("arrearSection").style.display =
        (value === "yes") ? "block" : "none"
}

function uploadStudents(){

let dept = document.getElementById("dept").value
let file = document.getElementById("regularFile").files[0]
let arrearFile = document.getElementById("arrearFile").files[0]
let arrearDept = document.getElementById("arrearDept").value
let msg = document.getElementById("msg")

if(dept === "" || !file){
    msg.innerText = "Select department & file ❌"
    msg.style.color = "red"
    return
}

let formData = new FormData()
formData.append("dept", dept)
formData.append("regularFile", file)

if(arrearFile){
    formData.append("arrearFile", arrearFile)
    formData.append("arrearDept", arrearDept)
}

fetch("https://exam-seating-arrangement-k7ln.onrender.com/upload-students",{
    method:"POST",
    body: formData
})
.then(res=>res.text())
.then(data=>{
    msg.innerText = data
    msg.style.color = "green"
})
.catch(()=>{
    msg.innerText = "Upload failed ❌"
    msg.style.color = "red"
})

}

</script>

</body>
</html>
